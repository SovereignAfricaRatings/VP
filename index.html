<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward election intelligence: demonstration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F2F4F1;--sheet:#FBFCFA;--ink:#17262B;--muted:#586869;--line:#CDD5D0;--soft:#E8ECE8;
  --side:#14252B;--side-ink:#C9D6D3;--side-on:#24393F;--side-strong:#FFFFFF;
  --select:#C98A00;--warn:#A8371F;--ok:#2F6B4F;--flag-bg:#F4DF9B;--flag-ink:#3A2A00;
  --c0:#E3ECE6;--c1:#B4CFC4;--c2:#74A69D;--c3:#33737A;--c4:#12323F;
  --neg:#B5533C;--mid:#E6E9E5;--pos:#2F6F8F;
  --ANC:#1F7A3E;--DA:#1F5FA8;--EFF:#C0262D;--MK:#2A2A2A;--MKfg:#fff;--IFP:#C99A00;--PA:#0E8F8F;--ASA:#6BAA2C;--VF:#E57A17;--OTH:#8A9299;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181A;--sheet:#182124;--ink:#E6ECEA;--muted:#9FB0AF;--line:#2E3B3E;--soft:#1F2A2D;
  --side:#0B1113;--side-ink:#A9B8B6;--side-on:#1B272A;--side-strong:#FFFFFF;
  --select:#F0B429;--warn:#F08A6E;--ok:#6FC79A;--flag-bg:#4A3A08;--flag-ink:#FBE9A8;
  --c0:#22302F;--c1:#2F4F4B;--c2:#3F7A74;--c3:#62A9A6;--c4:#B7E3DC;--mid:#263234;--MK:#C9C9C9;--MKfg:#17262B;--OTH:#7C858B;}}
:root[data-theme="dark"]{
  --paper:#11181A;--sheet:#182124;--ink:#E6ECEA;--muted:#9FB0AF;--line:#2E3B3E;--soft:#1F2A2D;
  --side:#0B1113;--side-ink:#A9B8B6;--side-on:#1B272A;--side-strong:#FFFFFF;
  --select:#F0B429;--warn:#F08A6E;--ok:#6FC79A;--flag-bg:#4A3A08;--flag-ink:#FBE9A8;
  --c0:#22302F;--c1:#2F4F4B;--c2:#3F7A74;--c3:#62A9A6;--c4:#B7E3DC;--mid:#263234;--MK:#C9C9C9;--MKfg:#17262B;--OTH:#7C858B;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,"Segoe UI",Arial,sans-serif;
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}

/* ------------------------------------------------------------ app shell */
#app{min-height:100%;display:grid;grid-template-columns:212px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink)}
.side-in{position:sticky;top:env(safe-area-inset-top,0px);padding:20px 12px}
.brand{color:var(--side-strong);font-size:17px;font-weight:650;font-stretch:84%;line-height:1.15;padding:0 10px 18px}
.brand small{display:block;font-weight:400;font-size:12.5px;font-stretch:100%;color:var(--side-ink);margin-top:4px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:0;background:none;
  color:inherit;padding:8px 10px;border-radius:4px}
.side nav button:hover{background:var(--side-on)}
.side nav button[aria-current="page"]{background:var(--side-on);color:var(--side-strong);font-weight:600;box-shadow:inset 3px 0 0 var(--select)}
.side nav .gap{height:14px}
.pill{font-size:11.5px;padding:0 6px;border-radius:9px;background:var(--select);color:#17262B;font-weight:600}
.content{min-width:0}
.flag{background:var(--flag-bg);color:var(--flag-ink);padding:6px 28px;font-size:13px}
.flag b{font-weight:650}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 28px;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .run{margin-left:auto;color:var(--muted);font-size:13px}
.page{padding:26px 28px 72px}
.phead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.phead h1{font-size:31px;font-weight:650;font-stretch:78%;line-height:1.05;margin:0}
.phead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrls label{display:flex;gap:6px;align-items:center;color:var(--muted);min-width:0;max-width:100%}
.ctrls label select{min-width:0;flex:1 1 auto}
select{max-width:100%}

/* --------------------------------------------------------------- controls */
select,input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.btn{padding:6px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.primary:hover{opacity:.88}
.btn.quiet{border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-weight:600;text-align:left}
.link:hover{text-decoration-color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* ----------------------------------------------------------------- blocks */
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
.grid2.lead{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.grid2>.sticky{align-self:start}
.grid2>.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.grid2>.col>.card:last-child{flex:1}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:16px 18px;min-width:0}
.card h2{font-size:15px;font-weight:650;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card p{margin:4px 0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.sub{color:var(--muted)}
.small{font-size:12.5px}
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 16px;flex:1 1 168px;min-width:0}
.stat span{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:24px;font-weight:600;font-stretch:82%;line-height:1.2}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b em{font-style:normal}
.stat b em.long{display:block;font-size:14.5px;font-stretch:100%;font-weight:500;line-height:1.4;padding:3px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px}
.kv div span{display:block;color:var(--muted);font-size:12.5px}
.kv div b{font-weight:600;font-size:15px}
.box{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;background:var(--paper);font-size:13px}
.assume{font-size:12.5px;color:var(--muted);border-left:2px dashed var(--ink);padding-left:10px;margin-top:10px}

.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:2px;border:1.5px solid var(--ink);font-stretch:90%;white-space:nowrap}
.tag.FACT{background:var(--ink);color:var(--sheet)}
.tag.MEASUREMENT{background:var(--c1);border-color:var(--c3);color:#12323F}
.tag.MODELLED{background:none}
.tag.ASSUMPTION{background:none;border-style:dashed}
.tag.SYN{border-color:var(--flag-ink);background:var(--flag-bg);color:var(--flag-ink);border-style:dotted}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 12px 6px 0;vertical-align:bottom;white-space:nowrap}
td{padding:7px 12px 7px 0;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td small{color:var(--muted)}
table.tight td{white-space:nowrap}
table.c1 td:first-child{white-space:nowrap}
.link{white-space:nowrap}
tbody tr.pick:hover{background:var(--soft)}
.sorth{border:0;background:none;padding:0;font-weight:600;color:var(--muted)}
.sorth[aria-pressed="true"]{color:var(--ink)}
.best{font-weight:650}
.up{color:var(--ok)}.down{color:var(--warn)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* party composition strip */
.strip{display:flex;height:14px;border-radius:2px;overflow:hidden;min-width:110px;background:var(--soft)}
.strip i{display:block;height:100%}
.strip + small{display:block;margin-top:3px}

/* ward tiles */
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.tile{aspect-ratio:1/0.82;border:1px solid rgba(23,38,43,.25);border-radius:3px;padding:4px 5px;text-align:left;line-height:1.15;
  display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.tile:hover{filter:brightness(1.08)}
.tile b{font-weight:650;font-size:13px}
.tile span{font-size:11.5px;white-space:nowrap}
.legend{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;border:1px solid rgba(23,38,43,.3);vertical-align:baseline}

/* share bars */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:4px 0}
.track{position:relative;height:18px;background:var(--soft);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.whisk{position:absolute;top:50%;height:2px;background:var(--ink);transform:translateY(-50%)}
.whisk::before,.whisk::after{content:"";position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.whisk::before{left:0}.whisk::after{right:0}
.row .val{text-align:right;font-size:13px}
.row .val small{color:var(--muted);font-size:12px;display:block}


/* South Africa map */
.samap{width:100%;height:auto;display:block;max-width:640px;margin:0 auto}
.samap.small{max-width:430px}
.prov{stroke:var(--sheet);stroke-width:1.5;cursor:pointer;transition:filter .12s}
.prov:hover,.prov:focus-visible{filter:brightness(1.12);stroke:var(--ink);stroke-width:2;outline:none}
.prov.on{stroke:var(--select);stroke-width:4}
.plabel{font-size:15px;font-weight:600;font-stretch:88%;text-anchor:middle;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.plabel.tiny{font-size:12px}
.grid2.wide{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
tr.grp th{padding-top:16px;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line);background:none}
.tiles.dense{gap:3px}
.tiles.dense .tile{padding:2px 3px;aspect-ratio:1/1}
.tiles.dense .tile span{display:none}
.tiles.dense .tile b{font-size:11.5px}
@media (prefers-reduced-motion:reduce){.prov{transition:none}}
.form{display:grid;gap:10px}
.form label{display:block;font-size:12.5px;color:var(--muted)}
.form select,.form input{width:100%;margin-top:3px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px}
.params label{font-size:12.5px;color:var(--muted);display:block}
.params input{width:92px;margin-top:3px}
.layerrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--soft);align-items:start}
.layerrow:last-child{border-bottom:0}
.layerrow input{margin-top:4px;width:16px;height:16px}
.layerrow b{font-weight:600}
.layerrow.off b{color:var(--muted)}
.steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.step>i{font-style:normal;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:650}
.step.done>i{background:var(--ink);color:var(--sheet)}

@media (max-width:920px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side-in{position:static;padding:10px 12px 8px}
  .brand{padding:0 6px 8px;font-size:15px}.brand small{display:none}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .side nav button{white-space:nowrap;padding:7px 10px}
  .side nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--select)}
  .side nav .gap{display:none}
  .flag,.top{padding-left:16px;padding-right:16px}
  .top .run{margin-left:0}
  .page{padding:18px 16px 56px}
  .phead h1{font-size:26px}
  .grid2,.grid2.even,.grid2.wide{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .row{grid-template-columns:40px minmax(0,1fr) 132px}
}
@media (max-width:520px){.tile span{display:none}.tile{aspect-ratio:1/1}}

/* ---- v4: chain, ledger, scores, flows */
.side nav .grp{font-size:12px;color:var(--side-ink);opacity:.7;padding:14px 10px 4px}
.side nav .grp:first-child{padding-top:0}
.chain{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.chain>div{flex:1 1 210px;min-width:0;background:var(--sheet);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-content:start}
.chain i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:650;font-size:13px;grid-row:span 2}
.chain b{font-weight:650}
.chain span{color:var(--muted);font-size:12.5px;line-height:1.4}
.wtabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);margin:-6px 0 18px}
.wtabs button{border:0;background:none;padding:9px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted)}
.wtabs button[aria-selected="true"]{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
.card.lead{font-size:16px;line-height:1.5;border-left:4px solid var(--ink);display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:8px 32px;align-items:start}
.card.lead p{margin:0}
.card.lead p:last-child{color:var(--muted);font-size:14.5px}
table.ledger td,table.ledger th,table.matrix td,table.matrix th,table.scores td,table.scores th{white-space:nowrap}
table.ledger td,table.ledger th{padding-right:8px}
table.ledger td:first-child{white-space:normal;min-width:120px}
table.ledger tr.sum td,table.matrix tr.sum td,tr.sum td{border-top:1.5px solid var(--ink);font-weight:600}
td.sub{color:var(--muted);font-size:12px;font-weight:400}
.check{font-size:13px;margin:10px 0 0;padding:8px 12px;border-radius:4px;background:var(--soft)}
.check.ok{border-left:4px solid var(--ok)}
.check.bad{border-left:4px solid var(--warn);color:var(--warn)}
table.matrix td.diag{background:var(--soft)}
table.matrix td,table.matrix th,table.scores td,table.scores th{padding:6px 10px}
table.scores td.n{min-width:62px}
table.scores th small{font-weight:400}
table.pillars td{vertical-align:top}
table.pillars ul{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px;min-width:200px}
table.pillars input[type=number]{width:64px}
tr.offrow td{opacity:.5}
tr.offrow td:first-child{opacity:1}
.algo{margin:0;padding-left:20px;display:grid;gap:8px}
.algo b{font-weight:650}
.mini{height:5px;background:var(--soft);border-radius:2px;margin-top:3px;min-width:70px}
.mini i{display:block;height:100%;border-radius:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.grid3 h3{font-size:13px;font-weight:650;margin:0 0 4px}
@media (max-width:1500px){table.ledger{font-size:12.5px}table.ledger td,table.ledger th{padding-right:6px}}
@media (max-width:1380px){.grid2.lead{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1380px) and (min-width:921px){.mapwrap{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:8px 32px;align-items:center}.mapwrap .samap{margin:0}.mapwrap .legend{flex-direction:column;align-items:flex-start;gap:6px}}
@media (max-width:1240px){.grid2,.grid2.even,.grid2.wide,.grid2.lead{grid-template-columns:minmax(0,1fr)}}
@media (max-width:920px){.side nav .grp{display:none}}
</style>

<body>
<div id="app"><p style="padding:40px;font-family:system-ui">Building the model for 4,392 wards…</p></div>
<script>
"use strict";
/* ============================================================================
   Ward election intelligence: demonstration build
   The model in one line: start from last election's votes, score the pressures on
   each party (pillar assessment), move votes between parties and in and out of
   voting (vote-flow algorithm), and report a result that adds up at every level.

   Real: party names; province outlines (Natural Earth); every municipality, its
         district, province and ward numbering (OpenUp, 2016 delimitation); the
         election date and national counts.
   Synthetic: every vote, score, poll, event, candidate and result.
   ========================================================================== */
const DATASET = "SYN-2026.10.05 (seed 20261104)";
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function norm(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const logit=p=>Math.log(p/(1-p)), expit=x=>1/(1+Math.exp(-x));
const softmax=l=>{const m=Math.max(...l);const e=l.map(v=>Math.exp(v-m));const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)};
const renorm=a=>{const s=a.reduce((x,y)=>x+y,0);return a.map(v=>v/s)};
const argmax=a=>{let bi=0;for(let i=1;i<a.length;i++) if(a[i]>a[bi]) bi=i;return bi};
const Z80=1.2816;
// Largest-remainder allocation: whole numbers that add up exactly to `total`.
function allot(weights,total){const n=weights.length, out=new Array(n).fill(0); let s=0; for(let i=0;i<n;i++) s+=weights[i];
  if(total<=0||s<=0) return out; const rem=[]; let used=0;
  for(let i=0;i<n;i++){const x=weights[i]/s*total, f=Math.floor(x); out[i]=f; used+=f; rem.push([x-f,i])}
  rem.sort((a,b)=>b[0]-a[0]||a[1]-b[1]); for(let k=0;k<total-used;k++) out[rem[k][1]]++; return out}

const _wt=new Float64Array(16), _fr=new Float64Array(16), _al=new Int32Array(16);
function allotBuf(n,total){let s=0,used=0; for(let i=0;i<n;i++) s+=_wt[i];
  if(total<=0||s<=0){for(let i=0;i<n;i++) _al[i]=0; return}
  for(let i=0;i<n;i++){const x=_wt[i]/s*total, f=Math.floor(x); _al[i]=f; _fr[i]=x-f; used+=f}
  for(let k=total-used;k>0;k--){let bi=0,bv=-1; for(let i=0;i<n;i++) if(_fr[i]>bv){bv=_fr[i];bi=i} _al[bi]++; _fr[bi]=-1}}

const PARTIES=[
 {id:"ANC",name:"African National Congress",dark:1},{id:"DA",name:"Democratic Alliance",dark:1},
 {id:"EFF",name:"Economic Freedom Fighters",dark:1},{id:"MK",name:"uMkhonto weSizwe Party",dark:1},
 {id:"IFP",name:"Inkatha Freedom Party",dark:0},{id:"PA",name:"Patriotic Alliance",dark:1},
 {id:"ASA",name:"ActionSA",dark:0},{id:"VF",name:"Freedom Front Plus",abbr:"FF+",dark:0},
 {id:"OTH",name:"Other parties and independents",abbr:"Other",dark:1}];
const NP=PARTIES.length, ab=i=>PARTIES[i].abbr||PARTIES[i].id;
// A registered voter starts in one of 11 groups and ends in one of 10.
const ABS=9, NV=9, NEW=10, NO=11, ND=10;

function buildCands(m){const gn=rng(88000+m.mi), used=new Set(), keys=Object.keys(NAME_POOL);
  const name=()=>{for(let t=0;t<40;t++){let pool="AF";
      if(t<25){let u=gn(); for(const [k,p] of NAME_MIX[m.prov]){if(u<p){pool=k;break} u-=p}} else pool=keys[Math.floor(gn()*keys.length)];
      const [f,l]=NAME_POOL[pool], n=f[Math.floor(gn()*f.length)]+" "+l[Math.floor(gn()*l.length)]; if(!used.has(n)){used.add(n);return n}}
    return "Candidate "+(used.size+1)};
  wardsOf(m).forEach(w=>{const g=rng(77000+w.ix), c=w.cand, rows=[], councillor=name();
    const named=[0,1,2].concat([3,4,5,6,7].filter(i=>Math.max(w.base[i],w.n24[i])>=.03));
    named.forEach(i=>{let status,sitting=false,score=0;
      if(i===w.inc){ if(c.standing){status="Sitting ward councillor, standing again";sitting=true;score=1} else if(c.switchTo!==null){status="Stands in place of "+councillor+", who left the party";score=-1.1} else {status="Stands in place of sitting councillor "+councillor;score=-.5}}
      else if(i===c.switchTo){status="Sitting ward councillor, switched from the "+ab(w.inc);sitting=true;score=1.4}
      else if(g()<.12){status="Sitting list councillor";score=.4} else status="Challenger";
      const mentions=Math.floor(g()*g()*14)+(sitting?2:0);

// ------------------------------------------------------------------- events
function evTime(e,day,half){ if(e.day>day) return 0;
  if(e.persistent&&(e.end===null||e.end>=day)) return 1;
  const from=e.end===null?e.day:Math.min(e.end,day); return Math.pow(.5,Math.max(0,day-from)/half)}
// Events move pillar scores: service events fall on the ward incumbent's Governance and services score,
// party disputes on that party's Organisation score. Disruption also lowers participation.
function eventField(events,day,beta,propN,muniW){
  const f=new Array(WARDS.length);
  const cell=i=>f[i]||(f[i]={s:new Float32Array(NP),g:new Float32Array(NP),neg:0,last:-999,list:[]});
  events.forEach(e=>{ if(!e.verified||e.day>day) return;
    const c=CATS[e.cat], wt=e.sev/5*e.cred*evTime(e,day,c.half); if(wt<.005) return;
    const src=wardById(e.ward), sign=c.positive?1:-1, pil=c.pillar||"service";
    const hit=(w,scale,how)=>{const t=e.party!==null?e.party:w.inc, x=sign*beta*wt*scale, k=cell(w.ix);
      (pil==="ground"?k.g:k.s)[t]+=x; if(sign<0) k.neg+=wt*scale; k.last=Math.max(k.last,e.day); k.list.push({e,weight:wt*scale,how,target:t,shift:x,pillar:pil})};
    if(e.scope==="municipality"){const m=MUNIS[e.mi]; for(let i=m.w0;i<m.w0+m.n;i++) hit(WARDS[i],i===src.ix?1:muniW,i===src.ix?"origin ward":"municipality-wide")}
    else{hit(src,1,"this ward"); if(propN>0) src.nb.forEach(i=>hit(WARDS[i],propN,"adjoining ward"))}
  }); return f}
const NOEV={s:new Float32Array(NP),g:new Float32Array(NP),neg:0,last:-999,list:[]};

// --------------------------------------------------------- the flow algorithm
// Given each party's composite score C and the ward's participation score P, move every registered voter
// from where they were in 2021 to where they are expected to be now. Returns an 11 x 10 table of whole
// voters whose rows add up to the starting groups and whose total is the number registered.
function flow(w,C,P,q){const F=new Int32Array(NO*ND), home=Math.exp(-q.part*P), O=w.O, tv=w.tv, pull=_pull;
  for(let j=0;j<NP;j++) pull[j]=Math.exp(q.pull*C[j]);

    const keep=Math.round(n*expit(q.lgLoyal+q.sens*C[i])); F[i*ND+i]=keep; const leave=n-keep; if(!leave) continue;
    for(let j=0;j<NP;j++) _wt[j]=tv[i*NP+j]*pull[j]; _wt[ABS]=w.ta[i]*home;      // tv already holds propensity x local conditions x local presence
    allotBuf(ND,leave); for(let j=0;j<ND;j++) F[i*ND+j]+=_al[j]}
  {const n=O[NV], mob=Math.round(n*expit(q.lgMob+q.part*P)); for(let j=0;j<NP;j++) _wt[j]=w.str[j]*pull[j];
   allotBuf(NP,mob); for(let j=0;j<NP;j++) F[NV*ND+j]=_al[j]; F[NV*ND+ABS]=n-mob}
  {const n=O[NEW], v=Math.round(n*expit(q.lgNew+q.part*P)); for(let j=0;j<NP;j++) _wt[j]=w.str[j]*NEW_AFF[j]*pull[j];

const colSums=F=>{const D=new Array(ND).fill(0); for(let i=0;i<NO;i++) for(let j=0;j<ND;j++) D[j]+=F[i*ND+j]; return D};

// The simulated "real world". The model never reads this; it is only used to draw polls and the final result.
const TRUE_Q=flowPrm({loyal:.78,sens:1.5,pull:1.3,part:.5,mob:.10,newTurn:.38}), TRUE_EV=1.1, TRUE_MUNI=.6, TW=PILLARS.reduce((a,p)=>a+p.tw,0);
function truth(events,day,late){

    return {sh:votes.map(v=>v/valid),turnout:(valid+w.spoilt)/w.reg,votes,valid}})}

// Each metro has its own poll; wards outside the metros rely on their province's poll.
(function(){const r=rng(424242), tp=truth(EVENTS,-11,false), DEFF=1.3;
  const sample=(p,n)=>renorm(p.map(v=>Math.max(v+norm(r)*Math.sqrt(DEFF*v*(1-v)/n),0)));
  const acc={};
  WARDS.forEach(w=>{if(w.survey) w.survey.shares=sample(tp[w.ix].sh,w.survey.n);
    const a=acc[w.region]||(acc[w.region]={v:new Array(NP).fill(0),b:new Array(NP).fill(0),cast:0,cast0:0,reg:0});
    for(let i=0;i<NP;i++){a.v[i]+=tp[w.ix].votes[i]; a.b[i]+=w.O[i]} a.cast+=tp[w.ix].valid+w.spoilt; a.cast0+=w.cast0; a.reg+=w.reg});
  Object.keys(acc).forEach(k=>{const a=acc[k], R=REGIONS[k];
    R.shares=sample(renorm(a.v),R.n); R.stated=clamp(a.cast/a.reg+.10+.02*norm(r),.2,.9); R.baseAgg=renorm(a.b); R.baseTurn=a.cast0/a.reg})})();

const wardLink=(w,label)=>`<button class="link" data-act="ward" data-id="${w.id}">${label||"Ward "+w.no}</button>`;
const wardName=w=>MUNIS[w.mi].name+" "+w.no;
const provSelect=(key,val,all)=>`<select data-sel="${key}">${all?`<option value="ALL" ${val==="ALL"?"selected":""}>${all}</option>`:""}${
  PROV_ORDER.map(p=>`<option value="${p}" ${p===val?"selected":""}>${PROVS[p]}</option>`).join("")}</select>`;
const muniSelect=(key,prov,val)=>`<select data-sel="${key}">${MUNIS.filter(m=>m.prov===prov).map(m=>`<option value="${m.code}" ${m.code===val?"selected":""}>${m.name} (${m.n})</option>`).join("")}</select>`;
const head=(title,sub,ctrls,crumbs)=>`<div class="phead"><div>${crumbs?`<div class="crumbs">${crumbs}</div>`:""}<h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${ctrls?`<div class="ctrls">${ctrls}</div>`:""}</div>`;
const stat=(label,value,note)=>`<div class="stat"><span>${label}</span><b>${value}</b>${note?`<small>${note}</small>`:""}</div>`;
const crumb=(...parts)=>parts.map(p=>p[1]?`<button class="link" data-act="${p[1]}" data-id="${p[2]||""}">${p[0]}</button>`:p[0]).join(" / ");
const NAV=[["g","Result"],["map","National picture"],["voters","Voter profiles"],["g","How the result is built"],["pillars","Pillar assessment"],["flows","Vote flows"],
  ["g","What feeds it"],["events","Events"],["candidates","Candidates"],["g","Checks"],["polls","Poll comparison"],["validation","Validation"],
  ["g","Record"],["changes","What changed"],["audit","Audit trail"]];
const SHORT={record:"Record",service:"Services",community:"Community",candidate:"Candidate",ground:"Ground",national:"National",funding:"Funding",media:"Media"};
const the=i=>i===8?"other parties and independents":"the "+ab(i), The=i=>i===8?"Other parties and independents":"The "+ab(i);
const list=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1];

// ------------------------------------------------------------ shared pieces
function tileStyle(w){const r=S.res[w.ix];
  if(S.mapMode==="leader"){const p=PARTIES[r.leader];return [`background:var(--${p.id});color:${p.id==="MK"?"var(--MKfg)":p.dark?"#fff":"#17262B"}`,ab(r.leader)+" "+pc(r.B[r.leader],0)]}
  if(S.mapMode==="margin"){const i=[.05,.10,.20,.35,9].findIndex(s=>r.margin<s);return [`background:var(--c${4-i});color:${i<2?"var(--paper)":"var(--ink)"}`,pc(r.margin,0)+" lead"]}
  if(S.mapMode==="move"){const d=r.B[w.inc]-w.base[w.inc], a=clamp(Math.abs(d)/.2,0,1);
    return [`background:color-mix(in srgb,var(--${d<0?"neg":"pos"}) ${Math.round(a*100)}%,var(--mid));color:${a>.55?"#fff":"var(--ink)"}`,pt(d,0)]}
  const i=[45,55,65,75,999].findIndex(s=>r.conf<s);return [`background:var(--c${i});color:${i>2?"var(--paper)":"var(--ink)"}`,r.conf+" / 100"]}
const LEGENDS={leader:()=>PARTIES.map((p,i)=>`<span><i style="background:var(--${p.id})"></i>${ab(i)}</span>`).join(""),
  margin:()=>["Under 5 pts","5 to 10","10 to 20","20 to 35","Over 35"].map((t,i)=>`<span><i style="background:var(--c${4-i})"></i>${t}</span>`).join(""),
  move:()=>`<span><i style="background:var(--neg)"></i>Incumbent losing share</span><span><i style="background:var(--mid)"></i>Little change</span><span><i style="background:var(--pos)"></i>Incumbent gaining</span>`,
  conf:()=>["Under 45","45 to 55","55 to 65","65 to 75","Over 75"].map((t,i)=>`<span><i style="background:var(--c${i})"></i>${t}</span>`).join("")};
const MODES=[["leader","Leading party","Leading party and its estimated share."],["margin","Competitiveness","Lead of the first party over the second. Darker is closer."],
  ["move","Movement","Change in the incumbent party's share since 2021."],["conf","Confidence","Evidence confidence: completeness, freshness and model uncertainty."]];
function bars(sh,lo,hi,extra){const mx=Math.min(1,Math.ceil(Math.max(...hi)*10)/10)||1;
  return sh.map((v,i)=>({v,i})).filter(o=>o.v>=.02||o.i===8).sort((a,b)=>b.v-a.v).map(({v,i})=>
   `<div class="row"><span title="${esc(PARTIES[i].name)}">${ab(i)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%;background:var(--${PARTIES[i].id});opacity:.85"></div>
    <div class="whisk" style="left:${lo[i]/mx*100}%;width:${Math.max((hi[i]-lo[i])/mx*100,.5)}%"></div></div>
    <span class="val">${pc(v)}<small>${pc(lo[i],0)} to ${pc(hi[i],0)}${extra?extra(i):""}</small></span></div>`).join("")}
const strip=s=>`<div class="strip" role="img" aria-label="Wards led by each party">${s.lead.map((n,i)=>n?`<i style="width:${n/s.n*100}%;background:var(--${PARTIES[i].id})" title="${ab(i)} ${n}"></i>`:"").join("")}</div>
  <small class="sub">${s.lead.map((n,i)=>({n,i})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,4).map(x=>ab(x.i)+" "+x.n).join(", ")}</small>`;
const LABEL_NUDGE={NW:[-42,14],MP:[30,26],GT:[2,-2],LIM:[0,6],KZN:[-8,8]};
const CLOSE_BINS=[.08,.11,.14,.18,9], CLOSE_LABELS=["Under 8%","8 to 11%","11 to 14%","14 to 18%","Over 18%"];
function saMap(selected,small){
  return `<svg class="samap ${small?"small":""}" viewBox="0 0 ${PROVMAP.w} ${PROVMAP.h}" role="group" aria-label="Map of South Africa by province">${
   PROVMAP.prov.map(p=>{const t=rollup(MUNIS.filter(m=>m.prov===p.code)), i=CLOSE_BINS.findIndex(s=>t.close/t.n<s);
    return `<path d="${p.d}" class="prov ${selected===p.code?"on":""}" style="fill:var(--c${i})" data-act="prov" data-id="${p.code}" tabindex="0" role="button" aria-label="${PROVS[p.code]}: ${t.n} wards, ${t.close} close contests"><title>${PROVS[p.code]}: ${t.munis} municipalities, ${num(t.n)} wards, ${t.close} close contests</title></path>`}).join("")}${
   small?"":PROVMAP.prov.map(p=>{const o=LABEL_NUDGE[p.code]||[0,0];return `<text x="${p.lx+o[0]}" y="${p.ly+o[1]}" class="plabel ${p.code==="GT"?"tiny":""}">${PROVS[p.code]}</text>`}).join("")}</svg>`}

// The ledger: every registered voter counted once at the start and once at the end.
function ledgerCard(F,reg,spoilt,title,note){const L=ledger(F,reg,spoilt), ord=PARTIES.map((p,i)=>i).filter(i=>L.start[i]||L.end[i]).sort((a,b)=>L.end[b]-L.end[a]);
  const row=i=>{const s0=L.valid0?L.start[i]/L.valid0:0, s1=L.end[i]/L.valid, d=s1-s0;return `<tr><td>${sw(i)}${ab(i)}</td><td class="n">${num(L.start[i])}</td><td class="n">${num(L.kept[i])}</td>
    <td class="n down">${L.start[i]-L.kept[i]?"-"+num(L.start[i]-L.kept[i]):"0"}</td><td class="n up">${L.end[i]-L.kept[i]?"+"+num(L.end[i]-L.kept[i]):"0"}</td><td class="n best">${num(L.end[i])}</td>
    <td class="n">${pc(s1)}</td><td class="n ${d<0?"down":"up"}">${pt(d)}</td></tr>`};
  const nv0=L.start[NV], mob=nv0-L.stayedHome, absGain=L.end[ABS]-L.stayedHome;
  return `<div class="card"><h2>${title} ${tag("MODELLED")} ${syn}</h2>${note?`<p class="sub small">${note}</p>`:""}
   <div class="scroll"><table class="ledger"><thead><tr><th>Where voters are</th><th class="n">Start (2021)</th><th class="n">Stayed</th><th class="n">Left</th><th class="n">Arrived</th><th class="n">Now</th><th class="n">Share</th><th class="n">Change</th></tr></thead>
   <tbody>${ord.map(row).join("")}
    <tr class="sum"><td>Valid votes</td><td class="n">${num(L.valid0)}</td><td></td><td></td><td></td><td class="n best">${num(L.valid)}</td><td class="n">100.0%</td><td></td></tr>
    <tr><td>Spoilt ballots <small>held constant</small></td><td class="n">${num(spoilt)}</td><td></td><td></td><td></td><td class="n">${num(spoilt)}</td><td></td><td></td></tr>
    <tr><td>Registered, not voting</td><td class="n">${num(nv0)}</td><td class="n">${num(L.stayedHome)}</td><td class="n down">${mob?"-"+num(mob):"0"}</td><td class="n up">${absGain?"+"+num(absGain):"0"}</td><td class="n">${num(L.end[ABS])}</td><td></td><td></td></tr>
    <tr><td>Newly registered <small>since 2021, all placed above</small></td><td class="n">${num(L.start[NEW])}</td><td></td><td class="n down">${L.start[NEW]?"-"+num(L.start[NEW]):"0"}</td><td></td><td class="n">0</td><td></td><td></td></tr>
    <tr class="sum"><td>Registered voters</td><td class="n">${num(reg)}</td><td></td><td></td><td></td><td class="n best">${num(reg)}</td><td></td><td></td></tr></tbody></table></div>
   <p class="check ${L.gap===0&&L.gap0===0?"ok":"bad"}">${L.gap===0&&L.gap0===0?"Balanced.":"Does not balance."} ${num(L.valid)} valid votes + ${num(spoilt)} spoilt + ${num(L.end[ABS])} not voting = ${num(L.valid+spoilt+L.end[ABS])} of ${num(reg)} registered.
    Turnout ${pc(L.cast/reg)} (2021: ${pc(L.cast0/(reg-L.start[NEW]))} of those then registered).</p></div>`}
// Where one starting group's voters end up.
function flowBars(F,from){let tot=0; const row=[]; for(let j=0;j<ND;j++){row.push(F[from*ND+j]); tot+=F[from*ND+j]}
  if(!tot) return `<div class="box">No voters in this group.</div>`;
  const items=row.map((v,j)=>({v,j})).filter(x=>x.v>0).sort((a,b)=>(b.j===from)-(a.j===from)||b.v-a.v), mx=Math.max(...items.map(x=>x.v));
  return items.map(({v,j})=>`<div class="row"><span>${j===from?"Stay":j===ABS?"No vote":DEST(j)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%;background:${j<NP?`var(--${PARTIES[j].id})`:"var(--muted)"};opacity:${j===from?.9:.7}"></div></div>
    <span class="val">${num(v)}<small>${pc(v/tot,0)} of the group</small></span></div>`).join("")}
function flowMatrix(F){const rows=[...Array(NO).keys()].filter(i=>{let s=0;for(let j=0;j<ND;j++) s+=F[i*ND+j];return s>0}), cols=[...Array(ND).keys()].filter(j=>{let s=0;for(let i=0;i<NO;i++) s+=F[i*ND+j];return s>0});
  const ct=cols.map(j=>{let s=0;for(let i=0;i<NO;i++) s+=F[i*ND+j];return s});
  return `<div class="scroll"><table class="matrix"><thead><tr><th>From (2021)</th>${cols.map(j=>`<th class="n">${j<NP?ab(j):"Not voting"}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>${
   rows.map(i=>{let t=0;return `<tr><td>${i<NP?sw(i)+ab(i):i===NV?"Did not vote":"Newly registered"}</td>${cols.map(j=>{const v=F[i*ND+j];t+=v;return `<td class="n ${i===j||(i===NV&&j===ABS)?"diag":""}">${v?num(v):""}</td>`}).join("")}<td class="n best">${num(t)}</td></tr>`}).join("")}
   <tr class="sum"><td>Now</td>${ct.map(v=>`<td class="n best">${num(v)}</td>`).join("")}<td class="n best">${num(ct.reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div>
   <p class="sub small">Read across: where each 2021 group is expected to be now. Shaded cells are voters who stay put. Rows add to the Start column of the ledger, columns to the estimate. Spoilt ballots are outside this table.</p>`}
const scoreOf=(w,r,k,p)=>{let s=w.so[k*NP+p]; if(k===K.service) s+=r.ev.s[p]; else if(k===K.ground) s+=r.ev.g[p]; return clamp(s,-2,2)};
const cellStyle=s=>`background:color-mix(in srgb,var(--${s<0?"neg":"pos"}) ${Math.round(Math.min(1,Math.abs(s)/2)*70)}%,transparent)`;
function verdict(names,L,lead,scope){const sh=i=>L.end[i]/L.valid, ord=PARTIES.map((p,i)=>i).sort((a,b)=>L.end[b]-L.end[a]);
  const a=ord[0], b=ord[1]; return `${scope}, ${the(a)} ${a===8?"are":"is"} on ${pc(sh(a))} of the vote (${pc(L.start[a]/L.valid0)} in 2021) and ${the(b)} on ${pc(sh(b))} (${pc(L.start[b]/L.valid0)}). Expected turnout is ${pc(L.cast/L.reg)}.`}

// ------------------------------------------------------------- national picture
function pageMap(){const left=ELECTION-S.day, all=rollup(MUNIS), inModel=S.events.filter(e=>e.verified&&e.day<=S.day).length, c=S.changes, L=ledger(all.F,all.reg,all.spoilt);
  const steps=[["1","Start","Every registered voter is placed where they were in 2021: a party, not voting, or not yet registered.",null],
    ["2","Pillar assessment","Each party is scored in each ward on eight pillars, from headwind to tailwind.","pillars"],
    ["3","Vote flows","The scores decide how many voters each party keeps, and where the rest go.","flows"],
    ["4","Result","Voters are counted again. The totals match the register at ward, municipal, provincial and national level.",null],
    ["5","Check","The result is compared with polls now and with the real result after election day.","polls"]];
  return head("National picture",verdict(null,L,null,"Across all wards"))+`<div class="stack">
  <div class="chain">${steps.map(s=>`<div><i>${s[0]}</i><b>${s[3]?`<button class="link" data-act="nav" data-id="${s[3]}">${s[1]}</button>`:s[1]}</b><span>${s[2]}</span></div>`).join("")}</div>
  <div class="stats">${stat("Days to election",left,"4 November 2026")}${stat("Registered voters",num(all.reg),"Scaled to the IEC roll, May 2026")}${stat("Expected turnout",pc(L.cast/all.reg),num(L.cast)+" ballots")}
   ${stat("Wards",num(WARDS.length),MUNIS.length+" municipalities")}${stat("Close contests",num(all.close),"Lead under 5 points")}${stat("Events in the model",inModel,"Verified, dated on or before today")}</div>
  <div class="grid2 lead">${ledgerCard(all.F,all.reg,all.spoilt,"National result","Steps 1 and 4 side by side: where voters stood in 2021, how many stayed, left and arrived, and where they stand now.")}
  <div class="card"><h2>Provinces</h2><div class="mapwrap">${saMap(null)}
    <div><div class="legend"><span>Share of wards that are close contests:</span>${CLOSE_LABELS.map((t,i)=>`<span><i style="background:var(--c${i})"></i>${t}</span>`).join("")}</div>
    <p class="sub small">Select a province, then a municipality, then a ward. Province outlines are real (Natural Earth).</p></div></div></div></div>
  <div class="grid2 lead"><div class="card"><h2>By province</h2><div class="scroll"><table><thead><tr><th>Province</th><th class="n">Wards</th><th>Wards led by each party</th><th class="n">Turnout</th></tr></thead><tbody>${
    PROV_ORDER.map(p=>{const t=rollup(MUNIS.filter(m=>m.prov===p)), l=ledger(t.F,t.reg,t.spoilt);return `<tr class="pick"><td><button class="link" data-act="prov" data-id="${p}">${PROVS[p]}</button><br><small>${t.munis} municipalities</small></td><td class="n">${num(t.n)}</td><td>${strip(t)}</td><td class="n">${pc(l.cast/t.reg,0)}</td></tr>`}).join("")}</tbody></table></div></div>
  <div class="col"><div class="card"><h2>Latest model run</h2>${c?`<p><b>${c.run}</b>, ${stamp(c.ts)}</p><p>${esc(c.trigger)}.</p>
     <p class="sub">${num(c.list.length)} wards moved by more than 0.1 points; the leading party changed in ${c.list.filter(x=>x.lead0!==x.lead1).length}.</p>
     <p><button class="btn quiet" data-act="nav" data-id="changes">See what changed</button></p>`
     :`<p><b>${S.runs[0].id}</b>, ${stamp(S.runs[0].ts)}</p><p>${esc(S.runs[0].trigger)}.</p><p class="sub">Advance the model date or record an event to see votes move.</p>
     <p><button class="btn quiet" data-act="nav" data-id="events">Record an event</button></p>`}</div>
   <div class="card"><h2>What is real here ${tag("FACT")}</h2>
    <table><tbody><tr><td>Election day</td><td>4 November 2026</td></tr><tr><td>Register</td><td>The national total is set to the 27,912,415 voters on the roll in May 2026 <small>Electoral Commission</small>. How they are spread across wards is synthetic.</td></tr>
    <tr><td>Municipalities</td><td>All 213 that elect ward councillors, with their real names, districts and provinces.</td></tr>
    <tr><td>Wards</td><td>${num(WARDS.length)} wards, numbered as in the 2016 delimitation <small>OpenUp</small>. The 2026 delimitation has 4,488.</td></tr></tbody></table></div></div></div></div>`}

// ----------------------------------------------------------------- province
function pageProvince(){const ms=MUNIS.filter(m=>m.prov===S.prov), t=rollup(ms), L=ledger(t.F,t.reg,t.spoilt); let lastD=null;
  return head(PROVS[S.prov],verdict(null,L,null,"In "+PROVS[S.prov]),`<label>Province ${provSelect("prov",S.prov)}</label>`,crumb(["National picture","nav","map"],[PROVS[S.prov]]))+`<div class="stack">
  <div class="stats">${stat("Municipalities",t.munis,ms.filter(m=>m.metro).length+" metropolitan")}${stat("Wards",num(t.n))}${stat("Registered voters",num(t.reg))}${stat("Expected turnout",pc(L.cast/t.reg))}
   ${stat("Close contests",t.close,"Lead under 5 points")}${stat("Incumbent trailing",t.diff,"Wards where another party leads")}</div>
  <div class="grid2 lead">${ledgerCard(t.F,t.reg,t.spoilt,PROVS[S.prov]+" result","The sum of every ward in the province.")}
   <div class="card"><h2>Other provinces</h2><div class="mapwrap">${saMap(S.prov,true)}<div><p class="sub small">Select a province on the map to switch.</p></div></div></div></div>
  <div class="card"><h2>Municipalities</h2><p class="sub small">Select a municipality to see its wards.</p><div class="scroll"><table><thead><tr><th>Municipality</th><th class="n">Wards</th><th>Wards led by each party</th><th class="n">Close</th><th class="n">Incumbent trailing</th><th class="n">Turnout</th></tr></thead><tbody>${
    ms.map(m=>{const s=S.sum[m.mi], g=m.distName!==lastD?`<tr class="grp"><th colspan="6">${m.metro?"Metropolitan municipalities":m.distName+" District"}</th></tr>`:""; lastD=m.distName; const l=ledger(s.F,s.reg,s.spoilt);
     return g+`<tr class="pick"><td><button class="link" data-act="muni" data-id="${m.code}">${m.name}</button><br><small>${m.code}</small></td><td class="n">${m.n}</td><td>${strip(s)}</td>
      <td class="n">${s.close}</td><td class="n">${s.diff}</td><td class="n">${pc(l.cast/s.reg,0)}</td></tr>`}).join("")}</tbody></table></div></div></div>`}

// ------------------------------------------------------------- municipality
function pageMuni(){const m=muniOf(S.muni), ws=wardsOf(m), mode=MODES.find(x=>x[0]===S.mapMode), s=S.sum[m.mi], L=ledger(s.F,s.reg,s.spoilt);
  const val={no:w=>w.no,leader:w=>ab(S.res[w.ix].leader),share:w=>S.res[w.ix].B[S.res[w.ix].leader],margin:w=>S.res[w.ix].margin,
    move:w=>S.res[w.ix].B[w.inc]-w.base[w.inc],turn:w=>S.res[w.ix].turnout}[S.sort.key];
  const rows=ws.slice().sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:a.no-b.no)*S.sort.dir});
  const th=(k,l,n)=>`<th class="${n?"n":""}" aria-sort="${S.sort.key===k?(S.sort.dir>0?"ascending":"descending"):"none"}"><button class="sorth" data-act="sort" data-id="${k}" aria-pressed="${S.sort.key===k}">${l}${S.sort.key===k?(S.sort.dir>0?" ↑":" ↓"):""}</button></th>`;
  return head(m.name,verdict(null,L,null,"In "+m.name),
    `<label>Municipality ${muniSelect("muni",m.prov,m.code)}</label>`,
    crumb(["National picture","nav","map"],[PROVS[m.prov],"prov",m.prov],[m.name]))+`<div class="stack">
  <div class="stats">${stat("Wards",m.n,m.metro?"Metropolitan municipality":m.distName+" District")}${stat("Registered voters",num(s.reg))}${stat("Expected turnout",pc(L.cast/s.reg))}
   ${stat("Close contests",s.close,"Lead under 5 points")}${stat("Incumbent trailing",s.diff)}${stat("Service-stress index",m.stress.toFixed(2),"0 is low, 1 is high")}</div>
  <div class="grid2 lead">${ledgerCard(s.F,s.reg,s.spoilt,m.name+" result","The sum of its "+m.n+" wards.")}
   <div class="card"><h2>Wards 1 to ${m.n} ${syn}</h2><div class="seg" role="group" aria-label="Colour wards by" style="margin-bottom:10px">${MODES.map(([k,l])=>`<button data-act="mode" data-id="${k}" aria-pressed="${S.mapMode===k}">${l}</button>`).join("")}</div>
    <div class="tiles ${m.cols>10?"dense":""}" style="grid-template-columns:repeat(${m.cols},minmax(0,1fr));max-width:${m.cols*84}px">${ws.map(w=>{const [st,txt]=tileStyle(w);return `<button class="tile" style="${st}" data-act="ward" data-id="${w.id}" aria-label="Ward ${w.no}: ${txt}" title="Ward ${w.no}: ${txt}"><b>${w.no}</b><span>${txt}</span></button>`}).join("")}</div>
    <div class="legend">${LEGENDS[S.mapMode]()}</div><p class="sub small">${mode[2]} Schematic layout: tile positions and which wards adjoin each other are placeholders, not real geography.</p></div></div>
  <div class="card"><h2>Ward list</h2><div class="scroll"><table class="tight"><thead><tr>${th("no","Ward")}${th("leader","Leading")}${th("share","Share",1)}${th("margin","Lead",1)}${th("move","Incumbent movement",1)}${th("turn","Turnout",1)}</tr></thead><tbody>${
    rows.map(w=>{const r=S.res[w.ix], d=r.B[w.inc]-w.base[w.inc];return `<tr class="pick"><td>${wardLink(w)}</td><td>${sw(r.leader)}${ab(r.leader)}</td><td class="n">${pc(r.B[r.leader])}</td>
      <td class="n">${pt(r.margin)}</td><td class="n ${d<0?"down":"up"}">${ab(w.inc)} ${pt(d)}</td><td class="n">${pc(r.turnout,0)}</td></tr>`}).join("")}</tbody></table></div></div></div>`}

// ---------------------------------------------------------------- ward detail
const WTABS=[["summary","Result"],["pillars","Pillar assessment"],["flows","Vote flows"],["voters","Voter profile"],["candidates","Candidates"],["checks","Polls and data quality"]];
function wardSummary(w,m,r,L,win){
  const lost=[]; for(let j=0;j<ND;j++) if(j!==w.inc&&r.F[w.inc*ND+j]) lost.push([r.F[w.inc*ND+j],j]); lost.sort((a,b)=>b[0]-a[0]);
  const start=w.O[w.inc], kept=r.F[w.inc*ND+w.inc], ord=PARTIES.map((p,i)=>i).sort((a,b)=>r.votes[b]-r.votes[a]), a=ord[0], b=ord[1];
  return `<div class="card lead"><p><b>${The(a)}</b> ${a===8?"are":"is"} ahead with ${num(r.votes[a])} votes (${pc(r.B[a])}), ${num(r.votes[a]-r.votes[b])} more than ${the(b)}, and come${a===8?"":"s"} first in ${pc(win[a],0)} of ${MC} simulations.</p>
    <p>Of the ${num(start)} people who voted ${ab(w.inc)} here in 2021, ${num(kept)} are expected to do so again. ${lost.length?"The rest go mainly to "+list(lost.slice(0,3).map(x=>`${x[1]<NP?the(x[1]):"not voting"} (${num(x[0])})`))+".":""}</p></div>
  <div class="stats">${stat("Leading",sw(a)+ab(a)+" "+pc(r.B[a]),num(r.votes[a])+" votes")}${stat("Lead over second",num(r.votes[a]-r.votes[b])+" votes",pt(r.margin)+", "+r.enp.toFixed(1)+" effective parties")}
   ${stat("Turnout",pc(r.turnout),num(r.valid+w.spoilt)+" of "+num(w.reg)+" registered")}${stat("Incumbent",`<em class="${r.B[w.inc]<w.base[w.inc]?"down":"up"}">${ab(w.inc)} ${pt(r.B[w.inc]-w.base[w.inc])}</em>`,"Share since 2021")}
   ${stat("Evidence confidence",r.conf+" / 100","Data "+pc(w.complete,0)+" complete")}</div>
  <div class="grid2 lead">${ledgerCard(r.F,w.reg,w.spoilt,"Ward result","Where this ward's registered voters stood in 2021 and where they are expected to be now.")}
  <div class="card"><h2>Share of the vote, with uncertainty ${tag("MODELLED")}</h2>${bars(r.B,r.lo,r.hi,i=>win[i]>=.005?", first in "+pc(win[i],0):"")}
   <p class="sub small">Bars are estimated shares of valid votes. The line is the 80% interval. "First in" is the share of ${MC} simulations in which the party wins the ward.</p></div></div>`}
function wardPillars(w,m,r){const pv=pillarVotes(w), show=PARTIES.map((p,i)=>i).filter(i=>w.O[i]/w.valid0>=.02||r.B[i]>=.02).sort((a,b)=>r.votes[b]-r.votes[a]), wn=weightsOf(S.on,S.params);
  const evs=r.evs.slice().sort((a,b)=>b.weight-a.weight), q=flowPrm(S.params), top=show.slice(0,5);
  return `<div class="card"><h2>Scores by party and pillar ${tag("MEASUREMENT")} ${syn}</h2><p class="sub small">Each score runs from -2 (strong headwind) to +2 (strong tailwind), relative to 2021. The composite is the weighted average. It sets how many of its 2021 voters a party keeps and how strongly it attracts voters who are moving.</p>
   <div class="scroll"><table class="scores"><thead><tr><th>Party</th>${PILLARS.map((p,k)=>`<th class="n" title="${esc(p.name)}">${SHORT[p.id]}<br><small>${wn[k]?Math.round(100*wn[k])+"%":"off"}</small></th>`).join("")}<th class="n">Composite</th><th class="n">Keeps</th></tr></thead><tbody>${
    show.map(i=>`<tr><td>${sw(i)}${ab(i)}</td>${PILLARS.map((p,k)=>{const s=scoreOf(w,r,k,i);return `<td class="n" style="${wn[k]?cellStyle(s):"opacity:.4"}">${sc1(s)}</td>`}).join("")}
     <td class="n best" style="${cellStyle(r.C[i]*1.5)}">${(r.C[i]>0?"+":"")+r.C[i].toFixed(2)}</td><td class="n">${w.O[i]?pc(expit(q.lgLoyal+q.sens*r.C[i]),0):""}</td></tr>`).join("")}</tbody></table></div>
   <p class="sub small">"Keeps" is the share of the party's 2021 voters expected to vote for it again. Participation conditions for this ward score ${sc1(r.part)}${S.on.participation?"":" (switched off)"}.</p></div>
  <div class="grid2 lead"><div class="card"><h2>What each pillar is worth here, in votes ${tag("MODELLED")}</h2><p class="sub small">The result as it stands, minus the result with that pillar's scores set to zero.</p>
   <div class="scroll"><table><thead><tr><th>Pillar</th>${top.map(i=>`<th class="n">${ab(i)}</th>`).join("")}<th class="n">Ballots cast</th></tr></thead><tbody>${
    PILLARS.map((p,k)=>`<tr><td>${p.name}</td>${pv[k]?top.map(i=>`<td class="n ${pv[k].votes[i]<0?"down":pv[k].votes[i]>0?"up":""}">${sgn(pv[k].votes[i])}</td>`).join("")+`<td class="n">${sgn(pv[k].cast)}</td>`:`<td colspan="${top.length+1}" class="sub">Switched off</td>`}</tr>`).join("")}
    <tr><td>${PART.name}</td>${r.pvPart?top.map(i=>`<td class="n ${r.pvPart.votes[i]<0?"down":r.pvPart.votes[i]>0?"up":""}">${sgn(r.pvPart.votes[i])}</td>`).join("")+`<td class="n">${sgn(r.pvPart.cast)}</td>`:`<td colspan="${top.length+1}" class="sub">Switched off</td>`}</tr></tbody></table></div>
   <p class="sub small">The effects overlap, so the rows do not add up to the total change since 2021.</p></div>
  <div class="card"><h2>Events acting on this ward</h2>${evs.length?`<div class="scroll"><table><thead><tr><th>Event</th><th>Reaches ward as</th><th>Changes</th><th class="n">Score points</th></tr></thead><tbody>${
      evs.map(x=>`<tr><td>${esc(CATS[x.e.cat].title)}<br><small>${x.e.id}, ${fmt(x.e.day)}, severity ${x.e.sev} of 5</small></td><td>${x.how}</td><td>${ab(x.target)}, ${x.pillar==="ground"?"Organisation":"Governance and services"}</td><td class="n ${x.shift<0?"down":"up"}">${(x.shift>0?"+":"")+x.shift.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>`
      :`<div class="box">No verified event is acting on this ward at ${fmt(S.day)}.</div>`}</div></div>`}
function wardFlows(w,r){const from=w.O[S.flowFrom]?S.flowFrom:w.inc;
  return `<div class="grid2 even"><div class="card"><h2>Where one group's voters go</h2><div class="ctrls" style="margin-bottom:10px"><label>Starting group <select data-sel="flowFrom">${[...Array(NO).keys()].filter(i=>w.O[i]).map(i=>`<option value="${i}" ${i===from?"selected":""}>${ORIGIN(i)} (${num(w.O[i])})</option>`).join("")}</select></label></div>
    ${flowBars(r.F,from)}</div>
   <div class="card"><h2>Why they go there ${tag("ASSUMPTION")}</h2><p>A voter who leaves a party is not handed to its opponents in proportion to their size. Each destination is weighted by four things:</p>
    <table><tbody><tr><td>Transfer propensity</td><td>How readily voters of one party move to another, or stop voting.</td></tr>
    <tr><td>Local conditions</td><td>${PROVS[w.prov]}, ${w.settle.toLowerCase()}: ${list(PARTIES.map((p,i)=>[w.ctx[i],i]).filter(x=>Math.abs(x[0]-1)>.05).sort((a,b)=>b[0]-a[0]).slice(0,4).map(x=>ab(x[1])+" x"+x[0].toFixed(1)))||"no adjustment"}.</td></tr>
    <tr><td>Local presence</td><td>A party that has won few votes here before picks up few now.</td></tr>
    <tr><td>Pillar score</td><td>A party with a tailwind attracts more of the voters who are moving.</td></tr></tbody></table>
    <p class="sub small">The national table of propensities is on the <button class="link" data-act="nav" data-id="flows">Vote flows</button> page.</p></div></div>
  <div class="card"><h2>Full flow table for this ward ${tag("MODELLED")} ${syn}</h2>${flowMatrix(r.F)}</div>`}
function wardCandidates(w,r){const cl=w.cl;
  return `<div class="card"><h2>Candidates ${syn}</h2><p class="sub small">${cl.total} candidates on the ward ballot: ${cl.named} from the parties listed${cl.indep?", "+cl.indep+" independent":""}${cl.others?" and "+cl.others+" from other parties":""}. The candidate score feeds the Candidate pillar.</p>
     <div class="scroll"><table class="c1"><thead><tr><th>Party</th><th>Candidate</th><th>Stood in 2021</th><th class="n">Local mentions</th><th class="n">Candidate score</th><th class="n">Votes now</th></tr></thead><tbody>${
      cl.rows.map(c=>`<tr><td>${sw(c.party)}${c.label}</td><td><b>${c.name}</b><br><small>${c.status}</small></td><td>${c.stood?"Yes":"No"}</td><td class="n">${c.mentions}</td>
       <td class="n" style="${cellStyle(c.score)}">${sc1(c.score)}</td><td class="n">${c.party<8?num(r.votes[c.party]):"<small>in Other</small>"}</td></tr>`).join("")}${
      cl.others||cl.indep?`<tr><td>${sw(8)}Other parties${cl.indep?" and independents":""}</td><td>${cl.others} further candidate${cl.others===1?"":"s"}</td><td></td><td></td><td></td><td class="n">${num(r.votes[8])}</td></tr>`:""}</tbody></table></div>
     <p class="assume">${syn} The names are generated for this demonstration and do not refer to real people. The production build shows the Electoral Commission's certified candidate list.</p></div>`}
function wardChecks(w,m,r,o){const R=REGIONS[w.region];
  const show=PARTIES.map((p,i)=>i).filter(i=>i===8||Math.max(o.A.sh[i],o.B.sh[i],o.C.sh[i])>=.03).sort((a,b)=>o.C.sh[b]-o.C.sh[a]);
  const cell=(x,i)=>`<td class="n ${argmax(x.sh)===i?"best":""}">${pc(x.sh[i])}<br><small>${pc(x.lo[i],0)} to ${pc(x.hi[i],0)}</small></td>`;
  const pollSrc=o.A.src==="ward"?`Ward survey of ${w.survey.n} interviews, fieldwork ${fmt(w.survey.from)} to ${fmt(w.survey.to)}.`
    :`No ward survey. The ${R.label} of ${R.n} interviews (${fmt(R.from)} to ${fmt(R.to)}) is applied to this ward as a uniform swing.`;
  return `<div class="grid2"><div class="card"><h2>Poll comparison ${tag("MEASUREMENT")} ${tag("MODELLED")} ${syn}</h2>
     <div class="scroll"><table><thead><tr><th>Party</th><th class="n">A. Poll only</th><th class="n">B. Model without polls</th><th class="n">C. Combined</th></tr></thead>
     <tbody>${show.map(i=>`<tr><td>${sw(i)}${ab(i)}</td>${cell(o.A,i)}${cell(o.B,i)}${cell(o.C,i)}</tr>`).join("")}
     <tr><td>Turnout</td><td class="n">${pc(o.A.turnout)}<br><small>stated intention</small></td><td class="n">${pc(o.B.turnout)}</td><td class="n">${pc(o.C.turnout)}</td></tr></tbody></table></div>
     <p class="sub small">${pollSrc} ${S.polls?`In output C the poll carries ${pc(o.C.pollWeight,0)} of the weight in this ward.`:"The poll stream is switched off, so C equals B."} Output B is the model shown on the other tabs. Bold marks the leading party in each output.</p>
     ${o.A.src!=="ward"?`<p class="assume">${tag("ASSUMPTION")} Applying a ${o.A.src==="metro"?"metro":"provincial"} poll to a ward assumes every ward moved by the same amount. Extra uncertainty of 5 points is added for it.</p>`:""}</div>
   <div class="card"><h2>Data quality ${tag("FACT")} ${syn}</h2><div class="kv"><div><span>Evidence confidence</span><b>${r.conf} / 100</b></div><div><span>Data completeness</span><b>${pc(w.complete,0)}</b></div>
     <div><span>Freshness</span><b>${pc(r.fresh,0)}</b></div><div><span>Evidence last confirmed</span><b>${fmt(Math.max(w.lastConf,r.ev.last))}</b></div>
     <div><span>Boundary change score</span><b>${pc(w.boundary,0)}</b></div><div><span>By-election since 2021</span><b>${w.byEl?fmt(w.byEl.day):"None"}</b></div></div>
     <p class="sub small">Low completeness, stale evidence and large boundary changes all widen the uncertainty around this ward's shares. Ward id ${w.wid} in the 2016 delimitation.</p></div></div>`}
function pageWard(){const w=wardById(S.ward), m=MUNIS[w.mi], r=S.res[w.ix], o=S.out[w.ix], cl=w.cl, cand=w.cand, win=leadChance(w);
  const candTxt=cand.standing?`Sitting councillor ${cl.councillor} (${ab(w.inc)}) is standing again`

  const step=k=>`<button class="btn quiet" data-act="ward" data-id="${m.code}-${w.no+k}" ${w.no+k<1||w.no+k>m.n?"disabled":""}>${k<0?"Previous ward":"Next ward"}</button>`;
  const body={summary:()=>wardSummary(w,m,r,null,win),pillars:()=>wardPillars(w,m,r),flows:()=>wardFlows(w,r),voters:()=>wardVoters(w,r),candidates:()=>wardCandidates(w,r),checks:()=>wardChecks(w,m,r,o)}[S.wtab]();
  return head(`Ward ${w.no}, ${m.name}`,`${PROVS[m.prov]}. ${w.settle}. ${candTxt}.${cl.bigIndep?" "+cl.bigIndep.name+" is standing as a prominent independent.":""}`,
    `${step(-1)}${step(1)}<button class="btn" data-act="eventHere">Record an event here</button>`,

  `<div class="wtabs" role="tablist">${WTABS.map(([k,l])=>`<button role="tab" data-act="wtab" data-id="${k}" aria-selected="${S.wtab===k}">${l}</button>`).join("")}</div><div class="stack">${body}</div>`}

// ----------------------------------------------------------- pillar assessment
function pagePillars(){const wn=weightsOf(S.on,S.params), sum=PILLARS.reduce((a,p)=>a+(S.on[p.id]?S.params["w_"+p.id]:0),0);
  const avg=Array.from({length:NK+1},()=>new Array(NP).fill(0)), wt=new Array(NP).fill(0);
  WARDS.forEach(w=>{const r=S.res[w.ix]; for(let p=0;p<NP;p++){const v=w.O[p]+r.votes[p]; if(!v) continue; wt[p]+=v; for(let k=0;k<NK;k++) avg[k][p]+=v*scoreOf(w,r,k,p); avg[NK][p]+=v*r.C[p]}});
  return head("Pillar assessment","Step 2. What may sway voters, organised into eight pillars. Each party is scored on each pillar in every ward, from -2 (strong headwind) to +2 (strong tailwind), always relative to the last election. The weighted average is the party's composite score in that ward.")+`<div class="stack">
  <div class="card"><h2>The scorecard ${tag("ASSUMPTION")}</h2><p class="sub small">Weights are judgement calls until they are fitted on past elections. Change a weight or switch a pillar off and the whole model re-runs. Weights in use add to ${sum}; they are rescaled to 100%.</p>
   <div class="scroll"><table class="pillars"><thead><tr><th>On</th><th>Pillar</th><th class="n">Weight</th><th class="n">Share</th><th>What is scored</th><th>Where it comes from in the real build</th></tr></thead><tbody>${
    PILLARS.map((p,k)=>`<tr class="${S.on[p.id]?"":"offrow"}"><td><input type="checkbox" data-pillar="${p.id}" ${S.on[p.id]?"checked":""} aria-label="${esc(p.name)} on"></td><td><b>${p.name}</b><br><small>${p.blurb}</small></td>
     <td class="n"><input type="number" min="0" max="100" step="5" data-param="w_${p.id}" value="${S.params["w_"+p.id]}" aria-label="${esc(p.name)} weight"></td><td class="n">${wn[k]?Math.round(100*wn[k])+"%":"off"}</td>
     <td><ul>${p.factors.map(f=>`<li>${f[0]}</li>`).join("")}</ul></td><td><ul>${p.factors.map(f=>`<li>${f[1]}</li>`).join("")}</ul></td></tr>`).join("")}
    <tr class="${S.on.participation?"":"offrow"}"><td><input type="checkbox" data-pillar="participation" ${S.on.participation?"checked":""} aria-label="Participation conditions on"></td><td><b>${PART.name}</b><br><small>${PART.blurb}</small></td>
     <td class="n sub" colspan="2">Acts on turnout</td><td><ul>${PART.factors.map(f=>`<li>${f[0]}</li>`).join("")}</ul></td><td><ul>${PART.factors.map(f=>`<li>${f[1]}</li>`).join("")}</ul></td></tr></tbody></table></div></div>
  <div class="card"><h2>Average score by party, all wards ${tag("MEASUREMENT")} ${syn}</h2><p class="sub small">Weighted by each party's voters. Open any ward to see its own scores.</p>
   <div class="scroll"><table class="scores"><thead><tr><th>Party</th>${PILLARS.map((p,k)=>`<th class="n">${SHORT[p.id]}</th>`).join("")}<th class="n">Composite</th></tr></thead><tbody>${
    PARTIES.map((p,i)=>`<tr><td>${sw(i)}${ab(i)}</td>${PILLARS.map((pl,k)=>{const s=wt[i]?avg[k][i]/wt[i]:0;return `<td class="n" style="${wn[k]?cellStyle(s):"opacity:.4"}">${sc1(s)}</td>`}).join("")}<td class="n best" style="${cellStyle((wt[i]?avg[NK][i]/wt[i]:0)*1.5)}">${wt[i]?(avg[NK][i]/wt[i]>0?"+":"")+(avg[NK][i]/wt[i]).toFixed(2):""}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="grid2 even"><div class="card"><h2>How a score becomes votes</h2><table><tbody>
    <tr><td>Keeping voters</td><td>A party with a composite of zero keeps ${pc(S.params.loyal,0)} of its 2021 voters. A composite of -1 lowers that to ${pc(expit(logit(S.params.loyal)-S.params.sens),0)}; +1 raises it to ${pc(expit(logit(S.params.loyal)+S.params.sens),0)}.</td></tr>
    <tr><td>Attracting voters</td><td>Voters who leave a party are shared among the others and not voting. A higher composite gives a party a larger share of them.</td></tr>
    <tr><td>Turnout</td><td>Participation conditions change how many past non-voters and new registrants vote, and how many leavers stay home.</td></tr></tbody></table>
    <p class="sub small">The mechanics are on the <button class="link" data-act="nav" data-id="flows">Vote flows</button> page.</p></div>
   <div class="card"><h2>What is not in the scorecard</h2><p>Voting-intention polls. They are kept as a separate stream so the model can be tested against them. The National conditions pillar uses no opinion surveys for the same reason.</p>
    <p class="sub">Party-reported figures such as branch counts are marked low reliability. Funding is published nationally, so its spread across wards is an assumption.</p></div></div></div>`}

// ------------------------------------------------------------------ vote flows
function pageFlows(){const ms=S.flowScope==="ALL"?MUNIS:MUNIS.filter(m=>m.prov===S.flowScope), t=rollup(ms), from=S.flowFrom, where=S.flowScope==="ALL"?"South Africa":PROVS[S.flowScope];
  let tot=0; for(let j=0;j<ND;j++) tot+=t.F[from*ND+j];
  const P=["loyal","sens","pull","part","mob","newTurn"];
  return head("Vote flows","Step 3. Every registered voter is moved from where they stood in 2021 to where they are expected to be now. A vote a party loses goes to wherever that voter is most likely to go, which is often not the main opposition and often not to the polls at all.",
    `<label>Area ${provSelect("flowScope",S.flowScope,"South Africa")}</label>`)+`<div class="stack">
  <div class="grid2 even"><div class="card"><h2>Where one group's voters go, ${where} ${tag("MODELLED")} ${syn}</h2>
    <div class="ctrls" style="margin-bottom:10px"><label>Starting group <select data-sel="flowFrom">${[...Array(NO).keys()].map(i=>`<option value="${i}" ${i===from?"selected":""}>${ORIGIN(i)}</option>`).join("")}</select></label></div>${flowBars(t.F,from)}</div>
   <div class="card"><h2>The algorithm, in order</h2><ol class="algo"><li><b>Count the start.</b> Each ward's register is split into 2021 voters by party, registered non-voters and people registered since.</li>
    <li><b>Decide who stays.</b> Each party keeps a share of its voters set by its composite pillar score in that ward.</li>
    <li><b>Place those who leave.</b> Each leaver goes to another party or to not voting, weighted by transfer propensity, local conditions, the destination's local presence and its pillar score.</li>
    <li><b>Bring in new voters.</b> A share of past non-voters and new registrants vote, split by local presence and pillar score.</li>
    <li><b>Round to whole voters</b> so that every row and column adds up exactly, then sum wards into municipalities, provinces and the country.</li></ol></div></div>
  <div class="card"><h2>Full flow table, ${where} ${tag("MODELLED")} ${syn}</h2>${flowMatrix(t.F)}</div>
  <div class="card"><h2>Transfer propensities ${tag("ASSUMPTION")}</h2><p class="sub small">Of 100 voters leaving the party in each row, how many would go to each column before local conditions, local presence and pillar scores are applied. In the real build these are estimated from how voting districts moved between 2021 and 2024 and from vote-recall questions in surveys.</p>
   <div class="scroll"><table class="matrix"><thead><tr><th>Leaving</th>${[...Array(ND).keys()].map(j=>`<th class="n">${j<NP?ab(j):"Not voting"}</th>`).join("")}</tr></thead><tbody>${
    TRANSFER.map((row,i)=>`<tr><td>${sw(i)}${ab(i)}</td>${row.map((v,j)=>`<td class="n" style="${i===j?"":`background:color-mix(in srgb,var(--c3) ${Math.round(v*1.6)}%,transparent)`}">${i===j?"":v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <p class="sub small">Local conditions then scale each destination. By province: ${Object.entries(CTX_PROV).map(([p,o])=>PROVS[p]+" "+Object.entries(o).map(([k,v])=>(k==="VF"?"FF+":k==="ASA"?"ActionSA":k==="OTH"?"Other":k)+" x"+v).join(", ")).join("; ")}. In suburbs the DA, FF+ and ActionSA are scaled up and the EFF and MK down; in townships, informal settlements and rural wards the reverse.</p></div>
  <div class="card"><h2>Flow settings ${tag("ASSUMPTION")}</h2><div class="params">${P.map(k=>`<label>${PARAM_INFO[k]}<br><input type="number" step="0.05" min="0" max="3" data-param="${k}" value="${S.params[k]}"> <span>default ${DEFAULTS[k]}</span></label>`).join("")}</div></div></div>`}

// -------------------------------------------------------------------- events
function pageEvents(){const m=muniOf(S.evMuni), all=S.events.filter(e=>e.mi===m.mi).sort((a,b)=>b.day-a.day);
  const status=e=>!e.verified?"Awaiting verification, not in model":e.day>S.day?"Dated after the model date, hidden":e.persistent&&e.end===null?"In model, persistent":"In model, decaying";
  const live=all.filter(e=>e.verified&&e.day<=S.day).length;
  return head("Events","Local developments recorded as structured events. An event lowers or raises a pillar score for the party it falls on, then fades with time.",
    `<label>Province ${provSelect("evProv",m.prov)}</label><label>Municipality ${muniSelect("evMuni",m.prov,m.code)}</label>`)+`<div class="stack"><div class="grid2">
  <div class="card"><h2>Event register, ${m.name} ${syn}</h2><p class="sub small">${all.length} events on record, ${live} in the model at ${fmt(S.day)}. ${num(S.events.length)} on record nationally.</p>
   ${all.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th>Ward</th><th>Reach</th><th>Pillar</th><th>Status</th></tr></thead><tbody>${
