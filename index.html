// ----------------------------------------------------------- poll comparison
function pagePolls(){const ws=S.pollProv==="ALL"?WARDS:WARDS.filter(w=>w.prov===S.pollProv);
  const nat={A:new Array(NP).fill(0),B:new Array(NP).fill(0),C:new Array(NP).fill(0)}, tv={A:0,B:0,C:0};
  const rows=ws.map(w=>{const o=S.out[w.ix]; let g=0,p=0; for(let i=0;i<NP;i++){const x=o.A.sh[i]-o.B.sh[i]; if(Math.abs(x)>Math.abs(g)){g=x;p=i}}
    for(const k of ["A","B","C"]){const v=w.reg*o[k].turnout; tv[k]+=v; for(let i=0;i<NP;i++) nat[k][i]+=v*o[k].sh[i]}
    return {w,o,g,p,la:argmax(o.A.sh),lb:S.res[w.ix].leader}});
  const differ=rows.filter(x=>x.la!==x.lb).length, own=rows.filter(x=>x.o.A.src==="ward").length;
  const top=rows.sort((a,b)=>Math.abs(b.g)-Math.abs(a.g)).slice(0,40), ord=PARTIES.map((p,i)=>i).sort((a,b)=>nat.C[b]-nat.C[a]);
  const lead=(x,i)=>`${sw(i)}${ab(i)} ${pc(x.sh[i],0)}`, SRC={ward:"Ward survey",metro:"Metro poll, swing",province:"Provincial poll, swing"};
  return head("Poll comparison","Step 5. The same wards three ways: the poll alone (A), the model without polls (B, the result shown everywhere else) and the two combined (C).",
    `<label>Area ${provSelect("pollProv",S.pollProv,"South Africa")}</label>`)+`<div class="stack">
  <div class="stats">${stat("Wards compared",num(rows.length))}${stat("Poll and model name different leaders",num(differ),pc(differ/rows.length,0)+" of wards")}${stat("Wards with their own survey",num(own),"The rest rely on a metro or provincial poll")}</div>
  ${S.polls?"":`<div class="box">The poll stream is switched off, so output C equals output B.</div>`}
  <div class="grid2 even"><div class="card"><h2>Share of the vote under each output ${syn}</h2><div class="scroll"><table><thead><tr><th>Party</th><th class="n">A. Poll only</th><th class="n">B. Model without polls</th><th class="n">C. Combined</th></tr></thead><tbody>${
    ord.map(i=>`<tr><td>${sw(i)}${ab(i)}</td>${["A","B","C"].map(k=>`<td class="n">${pc(nat[k][i]/tv[k])}</td>`).join("")}</tr>`).join("")}
    <tr class="sum"><td>Turnout</td>${["A","B","C"].map(k=>`<td class="n">${pc(tv[k]/ws.reduce((a,w)=>a+w.reg,0))}</td>`).join("")}</tr></tbody></table></div>
    <p class="sub small">Ward estimates added up, weighted by expected ballots. Polls record stated intention to vote, which runs above actual turnout.</p></div>
   <div class="card"><h2>Poll stream</h2><p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-polls ${S.polls?"checked":""}> Use polls in the combined output C</label></p>
    <p class="sub">Output B is produced by the pillar assessment and vote flows and takes no poll input. Switching polls on or off changes C only. That separation is what lets the model be tested against polling.</p></div></div>
  <div class="card"><h2>Largest disagreements ${tag("MEASUREMENT")} ${tag("MODELLED")} ${syn}</h2><div class="scroll"><table><thead><tr><th>Ward</th><th>Poll source</th><th>A. Poll only</th><th>B. Model without polls</th><th>C. Combined</th><th class="n">Largest gap, A minus B</th><th class="n">Poll weight in C</th></tr></thead><tbody>${
    top.map(x=>{const lc=argmax(x.o.C.sh);return `<tr class="pick"><td>${wardLink(x.w,wardName(x.w))}<br><small>${PROVS[x.w.prov]}</small></td><td>${SRC[x.o.A.src]}${x.o.A.src==="ward"?", "+x.w.survey.n:""}</td>
     <td>${lead(x.o.A,x.la)}</td><td class="${x.la!==x.lb?"best":""}">${lead(x.o.B,x.lb)}</td><td>${lead(x.o.C,lc)}</td>
     <td class="n ${x.g<0?"down":"up"}">${ab(x.p)} ${pt(x.g)}</td><td class="n">${pc(x.o.C.pollWeight,0)}</td></tr>`}).join("")}</tbody></table></div>
   <p class="sub small">Showing ${top.length} of ${num(rows.length)} wards. Bold in column B marks wards where the model and the poll name different leaders.</p></div></div>`}

// ------------------------------------------------------------- voter profiles
const PROFILE_STEPS=`<ol class="algo"><li><b>Count the electorate.</b> Each ward's registered voters are counted in 24 groups: four age bands, two sexes and three work statuses.</li>
  <li><b>Start from how groups lean.</b> Each group gets a starting lean towards each party, towards spoiling a ballot and towards not voting.</li>
  <li><b>Fit to the ward.</b> The table is scaled back and forth until every group adds up to its size and every party adds up to its votes in the ward ledger (iterative proportional fitting).</li>
  <li><b>Round to whole voters</b> so that both sets of totals still hold exactly.</li>
  <li><b>Read off the answer.</b> A party's most common voter is its largest group; its most over-represented voter is the group it draws on most heavily relative to that group's size.</li></ol>`;
function profileTable(P,cols){
  return `<div class="scroll"><table><thead><tr><th>Party</th><th class="n">Voters</th><th>Most common voter</th><th class="n">Share of its voters</th><th>Most over-represented voter</th><th class="n">Times the average</th></tr></thead><tbody>${
   cols.map(j=>{const c=P.cols[j];return `<tr><td>${j<NP?sw(j):sw(99)}${COLNAME(j)}</td><td class="n">${num(c.n)}</td><td><b>${gName(c.top)}</b></td><td class="n">${pc(c.topN/c.n,0)}<br><small>${num(c.topN)} voters</small></td>
     <td>${c.lg<0?"":gName(c.lg)}</td><td class="n">${c.lg<0?"":c.lift.toFixed(1)+"x"}</td></tr>`}).join("")}</tbody></table></div>`}
function profileCompare(P,j){const c=P.cols[j], a=P.all;
  const block=(title,labels,mine,all)=>`<tr class="grp"><th colspan="4">${title}</th></tr>`+labels.map((l,i)=>{const x=mine[i]/c.n, y=all[i]/a.n;return `<tr><td>${l}</td>
    <td class="n">${pc(x,0)}<div class="mini"><i style="width:${Math.min(100,x*100)}%;background:${j<NP?`var(--${PARTIES[j].id})`:"var(--muted)"}"></i></div></td>
    <td class="n">${pc(y,0)}<div class="mini"><i style="width:${Math.min(100,y*100)}%;background:var(--line)"></i></div></td><td class="n ${x<y?"down":"up"}">${pt(x-y,0)}</td></tr>`}).join("");
  return `<div class="scroll"><table><thead><tr><th>Group</th><th class="n">${COLNAME(j)}</th><th class="n">All registered voters</th><th class="n">Difference</th></tr></thead><tbody>${
    block("Age",AGES,c.ages,a.ages)}${block("Sex",SEXES,c.sexes,a.sexes)}${block("Work",WORK,c.works,a.works)}</tbody></table></div>`}
const colSelect=(cols,cur)=>`<label>Show <select data-sel="vpCol">${cols.map(j=>`<option value="${j}" ${j===cur?"selected":""}>${j<NP?PARTIES[j].name:COLNAME(j)}</option>`).join("")}</select></label>`;
function wardVoters(w,r){const T=voterTable(w), N=wardGroups(w), P=profileOf(T,N);
  const cols=[...Array(NP).keys()].filter(j=>r.votes[j]>=Math.max(20,.02*r.valid)).sort((a,b)=>r.votes[b]-r.votes[a]).concat([C_NV]), cur=cols.includes(S.vpCol)?S.vpCol:cols[0];
  let rowOK=true,colOK=true; const col=r.votes.concat([w.spoilt,w.reg-r.valid-w.spoilt]);
  for(let g=0;g<NG;g++){let t=0; for(let j=0;j<NC;j++) t+=T[g*NC+j]; if(t!==N[g]) rowOK=false} for(let j=0;j<NC;j++){let t=0; for(let g=0;g<NG;g++) t+=T[g*NC+j]; if(t!==col[j]) colOK=false}
  return `<div class="card"><h2>The most common voter for each party in this ward ${tag("MODELLED")} ${syn}</h2>
    <p class="sub small">Built by fitting the ward's registered voters, in 24 groups, to the votes in the ward ledger. Parties with fewer than 2% of the vote are left out.</p>${profileTable(P,cols)}
    <p class="check ${rowOK&&colOK?"ok":"bad"}">${rowOK&&colOK?"Balanced.":"Does not balance."} The 24 groups add up to the ${num(w.reg)} registered voters, and each party's groups add up to its votes in the ledger.</p></div>
   <div class="grid2 even"><div class="card"><h2>Profile against the ward</h2><div class="ctrls" style="margin-bottom:8px">${colSelect(cols,cur)}</div>${profileCompare(P,cur)}</div>
    <div class="card"><h2>How to read this</h2><p>"Most common" is the single largest group among a party's voters. It is often a small share, because 24 groups divide any party's vote thinly.</p>
     <p>"Most over-represented" is the group the party draws on most heavily for its size. A group 1.5 times the average supplies half as many voters again as its share of the register would suggest.</p>
     <p class="sub">The profile describes the result; it does not change it. The method and its starting assumptions are on the <button class="link" data-act="nav" data-id="voters">Voter profiles</button> page.</p></div></div>`}
function pageVoters(){const A=voterAgg(S.vpScope), P=profileOf(A.T,A.N), where=S.vpScope==="ALL"?"South Africa":PROVS[S.vpScope];
  const cols=[...Array(NP).keys()].filter(j=>P.cols[j].n>0).sort((a,b)=>P.cols[b].n-P.cols[a].n).concat([C_NV]), cur=cols.includes(S.vpCol)?S.vpCol:cols[0];
  const lean=(L,labels)=>`<div class="scroll"><table class="matrix"><thead><tr><th></th>${labels.map(l=>`<th class="n">${l}</th>`).join("")}</tr></thead><tbody>${
    L.map((row,j)=>j===C_SPOILT?"":`<tr><td>${j<NP?sw(j):sw(99)}${COLNAME(j)}</td>${row.map(v=>`<td class="n" style="${cellStyle((v-1)*3)}">${v.toFixed(2)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return head("Voter profiles","Who each party's voters are: the most common voter by age, sex and work status, for the country, a province or any ward. It is worked out from the result and the make-up of the electorate, and does not change the result.",
    `<label>Area ${provSelect("vpScope",S.vpScope,"South Africa")}</label>`)+`<div class="stack">
  <div class="card"><h2>The most common voter for each party, ${where} ${tag("MODELLED")} ${syn}</h2><p class="sub small">${num(A.wards)} ward tables added together. Open any ward and choose Voter profile to see the same table for that ward.</p>${profileTable(P,cols)}</div>
  <div class="grid2 even"><div class="card"><h2>Profile against all registered voters, ${where}</h2><div class="ctrls" style="margin-bottom:8px">${colSelect(cols,cur)}</div>${profileCompare(P,cur)}</div>
   <div class="card"><h2>How it is worked out</h2>${PROFILE_STEPS}</div></div>
  <div class="card"><h2>Starting leans ${tag("ASSUMPTION")}</h2><p class="sub small">How strongly each group leans towards each party before the fit, where 1.00 is no lean. These shape the answer wherever the ward totals leave room, so they are the part to challenge. In the real build they are estimated from survey cross-tabulations and from how ward results vary with ward demographics.</p>
   <div class="grid3"><div><h3>By age</h3>${lean(LEAN_AGE,AGES)}</div><div><h3>By sex</h3>${lean(LEAN_SEX,SEXES)}</div><div><h3>By work status</h3>${lean(LEAN_WORK,WORK)}</div></div></div>
  <div class="grid2 even"><div class="card"><h2>Where the inputs come from in the real build</h2><table><tbody>
    <tr><td>Electorate by group</td><td>Stats SA Census 2022 ward tables for age, sex and employment, aligned to the voters' roll by age and sex <small>Electoral Commission</small>.</td></tr>
    <tr><td>Votes by party</td><td>The ward ledger: the model's estimate before the election, the declared result after it.</td></tr>
    <tr><td>Starting leans</td><td>Survey cross-tabulations of vote by age, sex and work status, checked against ward-level regressions.</td></tr></tbody></table></div>
   <div class="card"><h2>Limits</h2><p>Ballots are secret, so no one observes who voted for whom. This is an estimate that is forced to agree with two things that are known, the electorate and the votes, and guided by the leans in between.</p>
    <p class="sub">Three characteristics give 24 groups. Income, education or home language can be added the same way, at the cost of thinner groups in small wards.</p></div></div></div>`}

// -------------------------------------------------------------- what changed
function pageChanges(){const c=S.changes;
  if(!c) return head("What changed","Each model run is compared with the one before it.")+`<div class="box">This is the first run, so there is nothing to compare yet. Advance the model date, record an event, or change a pillar weight.</div>`;
  const flips=c.list.filter(x=>x.lead0!==x.lead1).length;
  const row=x=>{const w=wardById(x.ward);return `<tr class="pick"><td>${wardLink(w,wardName(w))}<br><small>${PROVS[w.prov]}</small></td><td>${sw(x.party)}${ab(x.party)}</td><td class="n">${num(x.v0)}<br><small>${pc(x.from)}</small></td><td class="n">${num(x.v1)}<br><small>${pc(x.to)}</small></td>
    <td class="n ${x.d<0?"down":"up"}">${sgn(x.v1-x.v0)} votes<br><small>${pt(x.d)}</small></td><td>${x.driver}</td><td>${x.lead0!==x.lead1?ab(x.lead0)+" to "+ab(x.lead1):"No change"}</td></tr>`};
  return head("What changed",`${c.run} compared with ${c.prev}, ${stamp(c.ts)}.`)+`<div class="stack">
  <div class="stats">${stat("Cause",`<em class="long">${esc(c.trigger)}</em>`)}${stat("Wards that moved",num(c.list.length),"By more than 0.1 points, of "+num(WARDS.length))}${stat("Leading party changed",flips)}</div>
  <div class="card"><h2>Largest movements ${tag("MODELLED")} ${syn}</h2>${c.list.length?`<div class="scroll"><table><thead><tr><th>Ward</th><th>Largest mover</th><th class="n">Before</th><th class="n">After</th><th class="n">Change</th><th>Driver</th><th>Leading party</th></tr></thead>
    <tbody>${c.list.slice(0,30).map(row).join("")}</tbody></table></div><p class="sub small">Showing ${Math.min(30,c.list.length)} of ${num(c.list.length)}. The driver is the pillar whose score changed most for that party.</p>`
    :`<div class="box">No ward moved by more than 0.1 points.</div>`}</div></div>`}

// ---------------------------------------------------------------- validation
function pageValidation(){const F=S.frozen, sc=S.score;
  let h=head("Validation","Freeze the three outputs before election day, then score them against the result.")+`<div class="stack"><div class="card"><div class="steps">
   <div class="step ${F?"done":""}"><i>1</i><div><h2>Freeze outputs A, B and C</h2>${F?`<div class="kv"><div><span>Frozen as</span><b>${F.run}</b></div><div><span>Frozen at</span><b>${stamp(F.ts)}</b></div><div><span>Model date</span><b>${fmt(F.day)}</b></div><div><span>Wards held</span><b>${num(F.out.length)}</b></div></div>
     <p class="sub small">Later changes still update the live model but do not touch this set.</p>`
     :`<p>Stores the poll-only, model-without-polls and combined outputs for all ${num(WARDS.length)} wards exactly as they stand at ${fmt(S.day)}. A frozen set cannot be edited.</p><p><button class="btn primary" data-act="freeze">Freeze the three outputs</button></p>`}</div></div>
   <div class="step ${sc?"done":""}"><i>2</i><div><h2>Score against the result ${syn}</h2>${sc?`<p class="sub">Scored against a simulated result drawn from the same hidden synthetic world as the polls, with events up to election day.</p>`
     :`<p>The real election is on 4 November 2026, so there is no result yet. For this demonstration a simulated result is drawn from the same hidden synthetic world the polls came from.</p>
      <p><button class="btn primary" data-act="reveal" ${F?"":"disabled"}>Reveal simulated result and score</button></p>`}</div></div></div></div>`;
  if(!sc) return h+`</div>`;
  const rows=[["Vote-share error, all wards","mae",pts,1],["Turnout error","turn",pts,1],["Error in close wards ("+num(sc.A.nClose)+" wards, lead under 10 pts)","close",pts,1],["Error in other wards","open",pts,1],
    ["Error in fragmented contests ("+num(sc.A.nFrag)+" wards)","frag",pts,1],["Incumbent movement: direction right","dir",v=>pc(v,0),-1],["Incumbent movement: size error","mv",pts,1],
    ["Results inside the 80% interval (target 80%)","cov",v=>pc(v,0),0],["Leading party called","win",v=>pc(v,0),-1]];
  const best=(k,dirn)=>{const v=["A","B","C"].map(x=>sc[x][k]); if(v.includes(null)) return -1; return dirn===0?v.reduce((bi,x,i)=>Math.abs(x-.8)<Math.abs(v[bi]-.8)?i:bi,0):dirn>0?v.indexOf(Math.min(...v)):v.indexOf(Math.max(...v))};
  const order=["A","B","C"].sort((x,y)=>sc[x].mae-sc[y].mae), names={A:"the poll alone",B:"the model without polls",C:"the combined output"}, po=PARTIES.map((p,i)=>i).sort((a,b)=>sc.natTruth[b]-sc.natTruth[a]);
  return h+`<div class="stats">${stat("Lowest vote-share error",{A:"A. Poll only",B:"B. Model",C:"C. Combined"}[order[0]],pts(sc[order[0]].mae))}${stat("A. Poll only",pts(sc.A.mae))}${stat("B. Model without polls",pts(sc.B.mae))}${stat("C. Combined",pts(sc.C.mae))}</div>
  <div class="grid2 even"><div class="card"><h2>Scorecard, ward by ward ${syn}</h2><div class="scroll"><table><thead><tr><th>Measure</th><th class="n">A</th><th class="n">B</th><th class="n">C</th></tr></thead><tbody>${
    rows.map(([l,k,f,d])=>{const b=best(k,d);return `<tr><td>${l}</td>${["A","B","C"].map((x,i)=>`<td class="n ${i===b?"best":""}">${f(sc[x][k])}</td>`).join("")}</tr>`}).join("")}</tbody></table></div>
   <p class="sub small">Bold is the best of the three. On vote-share error, ${names[order[0]]} came first, ahead of ${names[order[1]]} and ${names[order[2]]}. "Leading party called" is last on purpose: it is one measure among several.</p></div>
   <div class="card"><h2>National vote share against the result ${syn}</h2><div class="scroll"><table><thead><tr><th>Party</th><th class="n">Result</th><th class="n">A</th><th class="n">B</th><th class="n">C</th></tr></thead><tbody>${
    po.map(i=>`<tr><td>${sw(i)}${ab(i)}</td><td class="n best">${pc(sc.natTruth[i])}</td>${["A","B","C"].map(x=>`<td class="n">${pc(sc[x].nat[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="sub small">Simulated turnout was ${pc(sc.turnTruth)}.</p></div></div>
  <div class="grid2"><div class="card"><h2>Ablation: what each pillar was worth</h2><div class="scroll"><table><thead><tr><th>Removed</th><th class="n">With it</th><th class="n">Without it</th><th class="n">Difference</th><th>Reading</th></tr></thead><tbody>${
    sc.abl.map(a=>{const d=a.without-a.full;return `<tr><td>${a.label}</td><td class="n">${pts(a.full)}</td><td class="n">${pts(a.without)}</td><td class="n ${d>0?"up":"down"}">${pt(d,2)}</td><td>${d>.0005?"Improved measurement":d<-.0005?"Made it worse":"Added little"}</td></tr>`}).join("")}</tbody></table></div>
    <p class="sub small">Each row re-runs the frozen model with one pillar removed. A positive difference means the error rose without it, so the pillar was adding information.</p></div>
   <div class="card"><h2>Vote-share error by province</h2><table><thead><tr><th>Province</th><th class="n">A</th><th class="n">B</th><th class="n">C</th></tr></thead><tbody>${
    PROV_ORDER.map(p=>{const v=["A","B","C"].map(x=>sc[x].by[p]), b=v.indexOf(Math.min(...v));return `<tr><td>${PROVS[p]}</td>${v.map((x,i)=>`<td class="n ${i===b?"best":""}">${pts(x)}</td>`).join("")}</tr>`}).join("")}</tbody></table></div></div>
  <p class="assume">${tag("ASSUMPTION")} The simulated world was built so the model is only partly right: some pillars matter more or less than their weights say, funding and advertising matter very little, several pillars are measured with error, adjoining wards do not influence each other, and people overstate their intention to vote by about 10 points. The scorecard shows how the test works, not how the real model will perform.</p></div>`}

// --------------------------------------------------------------- audit trail
function pageAudit(){
  return head("Audit trail",`Every model run, what triggered it and the settings in force. Dataset ${DATASET}, model version demo-0.3.`)+`<div class="stack"><div class="card"><h2>Model runs ${syn}</h2><div class="scroll"><table><thead><tr><th>Run</th><th>Time</th><th>Model date</th><th>Trigger</th><th>Pillars off</th><th class="n">Events in model</th><th class="n">Wards moved</th></tr></thead><tbody>${
   S.runs.map(r=>`<tr><td><b>${r.id}</b>${S.frozen&&S.frozen.run===r.id?"<br><small>frozen set</small>":""}</td><td>${stamp(r.ts)}</td><td>${fmt(r.day)}</td><td>${esc(r.trigger)}${r.analyst?"<br><small>analyst intervention</small>":""}</td>
   <td>${PILLARS.filter(p=>!r.on[p.id]).map(p=>SHORT[p.id]).concat(r.on.participation?[]:["Participation"]).concat(r.polls?[]:["Polls"]).join(", ")||"None"}</td><td class="n">${r.events}</td><td class="n">${r.moved===undefined?"":num(r.moved)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><h2>Uncertainty setting ${tag("ASSUMPTION")}</h2><div class="params"><label>${PARAM_INFO.sigma}<br><input type="number" step="0.02" min="0.02" max="1" data-param="sigma" value="${S.params.sigma}"> <span>default ${DEFAULTS.sigma}</span></label></div>
   <p class="sub small">Widens or narrows the 80% intervals. Pillar weights are on the Pillar assessment page, flow settings on Vote flows and event settings on Events.</p></div></div>`}

// --------------------------------------------------------------------- shell
const PAGES={voters:pageVoters,map:pageMap,province:pageProvince,muni:pageMuni,ward:pageWard,pillars:pagePillars,flows:pageFlows,polls:pagePolls,events:pageEvents,candidates:pageCandidates,changes:pageChanges,validation:pageValidation,audit:pageAudit};
function render(){const cur=["province","muni","ward"].includes(S.page)?"map":S.page, off=PILLARS.filter(p=>!S.on[p.id]).length+(S.on.participation?0:1);
  const badge={changes:S.changes&&S.changes.list.length?`<span class="pill">${num(S.changes.list.length)}</span>`:"",pillars:off?`<span class="pill">${off} off</span>`:"",validation:S.frozen&&!S.score?`<span class="pill">frozen</span>`:""};
  document.getElementById("app").innerHTML=`
  <aside class="side"><div class="side-in"><div class="brand">Ward election intelligence<small>2026 local government elections</small></div>
   <nav aria-label="Sections">${NAV.map(n=>n[0]==="g"?`<div class="grp">${n[1]}</div>`:`<button data-act="nav" data-id="${n[0]}" ${cur===n[0]?'aria-current="page"':""}>${n[1]}${badge[n[0]]||""}</button>`).join("")}</nav></div></aside>
  <div class="content"><div class="flag" role="note"><b>Synthetic demonstration data.</b> Places, party names and election facts are real; every vote, score, poll, event, candidate name and result is generated. Not a forecast.</div>
   <div class="top"><span>Model date <b>${fmt(S.day)}</b></span><button class="btn quiet" data-act="day" ${S.day>=LASTDAY?"disabled":""}>Advance one day</button>
    <button class="btn quiet" data-act="week" ${S.day>=LASTDAY?"disabled":""}>Advance one week</button>
    <span class="run">${S.runs[0].id}${S.frozen?", outputs frozen as "+S.frozen.run:""}</span></div>
   <main class="page">${PAGES[S.page]()}</main></div>`}
function go(page){S.page=page; window.scrollTo(0,0)}
function advance(n){const d0=S.day; S.day=Math.min(LASTDAY,S.day+n);
  const entered=S.events.filter(e=>e.verified&&e.day>d0&&e.day<=S.day).length;
  recompute(`Model date advanced from ${fmt(d0)} to ${fmt(S.day)}; ${entered} new event${entered===1?"":"s"} entered, older events faded`)}
function act(b){const a=b.dataset.act, id=b.dataset.id;
  if(a==="nav") go(id);
  else if(a==="prov"){S.prov=id; go("province")}
  else if(a==="muni"){S.muni=id; S.prov=muniOf(id).prov; S.sort={key:"no",dir:1}; go("muni")}
  else if(a==="ward"){const w=wardById(id), same=S.page==="ward"; S.ward=id; S.muni=MUNIS[w.mi].code; S.candMuni=S.muni; S.prov=w.prov; if(!same) S.wtab="summary"; S.page="ward"; if(!same) window.scrollTo(0,0)}
  else if(a==="wtab") S.wtab=id;
  else if(a==="mode") S.mapMode=id;
  else if(a==="sort") S.sort=S.sort.key===id?{key:id,dir:-S.sort.dir}:{key:id,dir:id==="no"||id==="leader"?1:-1};
  else if(a==="day") advance(1); else if(a==="week") advance(7);
  else if(a==="freeze") freeze(); else if(a==="reveal") reveal();
  else if(a==="eventHere"){const w=wardById(S.ward); S.evMuni=MUNIS[w.mi].code; S.evWard=w.no; go("events")}
  else if(a==="addEvent"){const m=muniOf(S.evMuni), w=wardById(m.code+"-"+Math.min(S.evWard,m.n)), cat=document.getElementById("ev-cat").value, sev=clamp(parseInt(document.getElementById("ev-sev").value,10)||3,1,5),
      scope=document.getElementById("ev-scope").value, per=document.getElementById("ev-per").value==="1";
    const e={id:"EV-A"+String(S.events.filter(x=>x.by==="analyst").length+1).padStart(2,"0"),ward:w.id,mi:m.mi,cat,sev,day:S.day,end:per?null:S.day+3,persistent:per,scope,party:null,cred:.9,verified:true,source:"Analyst entry",by:"analyst"};
    S.events.push(e); recompute(`Event ${e.id} recorded in ${m.name} ward ${w.no}: ${CATS[cat].label.toLowerCase()}, severity ${sev}, ${scope==="ward"?"ward reach":"municipality-wide"}`,true); go("changes")}
  render()}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]"); if(b&&!b.disabled) act(b)});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches("path[data-act]")){ev.preventDefault(); act(ev.target)}});
document.addEventListener("change",ev=>{const t=ev.target, d=t.dataset, first=p=>MUNIS.find(m=>m.prov===p).code;
  if(d.sel==="prov") S.prov=t.value;
  else if(d.sel==="muni"){S.muni=t.value; S.sort={key:"no",dir:1}}
  else if(d.sel==="pollProv") S.pollProv=t.value;
  else if(d.sel==="flowScope") S.flowScope=t.value;
  else if(d.sel==="flowFrom") S.flowFrom=parseInt(t.value,10);
  else if(d.sel==="vpScope") S.vpScope=t.value;
  else if(d.sel==="vpCol") S.vpCol=parseInt(t.value,10);
  else if(d.sel==="evProv"){S.evMuni=first(t.value); S.evWard=1}
  else if(d.sel==="evMuni"){S.evMuni=t.value; S.evWard=1}
  else if(d.sel==="evWard"){S.evWard=parseInt(t.value,10); return}
  else if(d.sel==="candProv") S.candMuni=first(t.value);
  else if(d.sel==="candMuni") S.candMuni=t.value;
  else if(d.pillar){const k=d.pillar, nm=k==="participation"?PART.name:PILLARS[K[k]].name; S.on[k]=t.checked; recompute(`Pillar "${nm}" switched ${t.checked?"on":"off"}`,true)}
  else if("polls" in d){S.polls=t.checked; recompute(`Poll stream switched ${t.checked?"on":"off"} for output C`,true)}
  else if(d.param){const k=d.param, isW=k.startsWith("w_"), v=clamp(parseFloat(t.value)||0,0,isW?100:3), old=S.params[k]; if(v===old) return; S.params[k]=v;
    recompute(isW?`Weight of "${PILLARS[K[k.slice(2)]].name}" changed from ${old} to ${v}`:`Setting "${PARAM_INFO[k]}" changed from ${old} to ${v}`,true)}
  else return; render()});
document.getElementById("app").innerHTML='<p style="padding:40px;font-family:system-ui">Building the model for 4,392 wards…</p>';
setTimeout(()=>{recompute("Initial run on the synthetic dataset"); render()},30);
</script>
</body>
</html>
